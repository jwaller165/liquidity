      + MEASURE(`FSE Non-Operational NMD`)

  - name: Total FSE GT30
    expr: MEASURE(`FSE Reciprocal Wholesale GT30`)

  - name: Total FSE Deposits
    expr: |-
      MEASURE(`FSE Operational Total`)
      + MEASURE(`Total FSE LT30`)
      + MEASURE(`Total FSE GT30`)

materialization:
  schedule: EVERY 12 HOURS
  mode: relaxed
  materialized_views:
    - name: ODM
      type: aggregated
      dimensions:
        - src_ac_tp_desc
      measures:
        - NFSE Insured Operational Deposits
        - NFSE Uninsured Operational Deposits
        - NFSE Uninsured Excess Operational Deposits
      cluster_by:
        auto: true