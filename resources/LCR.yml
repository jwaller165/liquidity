version: 1.1

source: finance.reporting.deposits

dimensions:
  - expr: source.*

measures:
  - name: NFSE Insured Operational Deposits
    expr: |-
      SUM(source.op_balance) FILTER (
        WHERE source.ops_flag = 'Y'
          AND source.wholesale_flag = 'Y'
          AND source.fully_insured_flag = 'Y'
          AND source.product_type <> 'Brokered'
          AND source.collateral_flag = 'N'
          AND source.counterparty_type <> 'FSE'
      )
    comment: "Insured operational deposits for non-FSE counterparties. Uses op_balance\
      \ where ops_flag=Y, wholesale, fully insured, non-brokered, no collateral, counterparty\
      \ not FSE."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: FSE Insured Operational Deposits
    expr: |-
      SUM(source.op_balance) FILTER (
        WHERE source.ops_flag = 'Y'
          AND source.wholesale_flag = 'Y'
          AND source.fully_insured_flag = 'Y'
          AND source.product_type <> 'Brokered'
          AND source.collateral_flag = 'N'
          AND source.counterparty_type = 'FSE'
      )
    comment: "Insured operational deposits for FSE counterparties. Uses op_balance\
      \ where ops_flag=Y, wholesale, fully insured, non-brokered, no collateral, counterparty=FSE."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: NFSE Uninsured Operational Deposits
    expr: |-
      SUM(source.op_balance) FILTER (
        WHERE source.ops_flag = 'Y'
          AND source.wholesale_flag = 'Y'
          AND source.fully_insured_flag = 'N'
          AND source.product_type <> 'Brokered'
          AND source.collateral_flag = 'N'
          AND source.counterparty_type <> 'FSE'
      )
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: NFSE Uninsured Excess Operational Deposits
    expr: |-
      SUM(source.non_op_balance) FILTER (
        WHERE source.ops_flag = 'Y'
          AND source.wholesale_flag = 'Y'
          AND source.fully_insured_flag = 'N'
          AND source.product_type <> 'Brokered'
          AND source.collateral_flag = 'N'
          AND source.counterparty_type <> 'FSE'
      )
    comment: "Non-operational balance portion on operational accounts (ops_flag=Y)\
      \ for uninsured, non-FSE counterparties. This is the excess above the operational\
      \ threshold, not a separate operational deposit."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: NFSE Insured Excess Operational Deposits
    expr: |-
      SUM(source.non_op_balance) FILTER (
        WHERE source.ops_flag = 'Y'
          AND source.wholesale_flag = 'Y'
          AND source.fully_insured_flag = 'Y'
          AND source.product_type <> 'Brokered'
          AND source.collateral_flag = 'N'
          AND source.counterparty_type <> 'FSE'
      )
    comment: "Non-operational balance portion on operational accounts (ops_flag=Y)\
      \ for insured, non-FSE counterparties."
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: FSE Excess Operational Deposits
    expr: |-
      SUM(source.non_op_balance) FILTER (
        WHERE source.ops_flag = 'Y'
          AND source.wholesale_flag = 'Y'
          AND source.deposit_type NOT IN ('CDs', 'Brokered')
          AND source.collateral_flag = 'N'
          AND source.counterparty_type = 'FSE'
      )
    comment: Non-operational balance portion on operational accounts (ops_flag=Y)
      for FSE counterparties. Filters on deposit_type (not product_type) to exclude
      CDs and Brokered. No insured/uninsured split — captures both.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: Unsecured Operational Deposits
    expr: MEASURE(`NFSE Insured Operational Deposits`) + MEASURE(`FSE Insured Operational
      Deposits`) + MEASURE(`NFSE Uninsured Operational Deposits`)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none

  - name: NFSE Insured Traditional Wholesale TD LT30
    expr: |-
      SUM(source.non_op_balance) FILTER (
        WHERE source.ops_flag = 'N'
          AND source.wholesale_flag = 'Y'
          AND source.fully_insured_flag = 'Y'
          AND source.product_type IN ('Traditional', 'Escrow', 'Sweep')
          AND source.collateral_flag = 'N'
          AND source.deposit_class = 'TIME'
          AND source.counterparty_type <> 'FSE'
          AND source.maturity_bucket_short = 'LT30'
      )
    format:
