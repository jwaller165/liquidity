    expr: MEASURE(`FSE Reciprocal Wholesale TD GT30`)

  - name: FSE Reciprocal Wholesale Total
    expr: |-
      MEASURE(`FSE Reciprocal Wholesale LT30`)
      + MEASURE(`FSE Reciprocal Wholesale GT30`)

  - name: FSE Non-Operational Total
    expr: MEASURE(`FSE Non-Operational NMD`)

  - name: FSE Operational Total
    expr: |-
